name: Publish-VSCode

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - ducklab-vscode/v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: ./vs-extension
        run: |
          chmod +x package.sh
          npm i -g pnpm@10.33.3
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run package
      - name: Verify VSIX packages
        run: |
          if ! compgen -G 'vs-extension/dist/*.vsix' > /dev/null; then
            echo "::error::No VSIX packages were generated"
            exit 1
          fi
      - name: Upload Windows VSIX artifacts
        if: ${{ hashFiles('vs-extension/dist/*-win32-*.vsix') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ducklab-vsix-windows
          path: vs-extension/dist/*-win32-*.vsix
          if-no-files-found: error
      - name: Upload Linux VSIX artifacts
        if: ${{ hashFiles('vs-extension/dist/*-linux-*.vsix') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ducklab-vsix-linux
          path: vs-extension/dist/*-linux-*.vsix
          if-no-files-found: error
      - name: Upload macOS VSIX artifacts
        if: ${{ hashFiles('vs-extension/dist/*-darwin-*.vsix') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ducklab-vsix-macos
          path: vs-extension/dist/*-darwin-*.vsix
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: ./vs-extension
        run: |
          npm i -g pnpm@10.33.3
          pnpm install --frozen-lockfile
      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ducklab-vsix-*
          merge-multiple: true
          path: vs-extension/dist
      - name: Publish to VS Code Marketplace
        working-directory: ./vs-extension
        env:
          VSCE_PAT: ${{ secrets.VSCODE_MARKETPLACE_PAT }}
        run: pnpm run publish

  release:
      needs: build
      # 仅在推送版本标签时发布 Release，避免 main 分支每次推送都发布
      if: startsWith(github.ref, 'refs/tags/ducklab-vscode/v')
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v4

        - name: Download VSIX artifacts
          uses: actions/download-artifact@v4
          with:
            pattern: ducklab-vsix-*
            merge-multiple: true
            path: dist

        - name: Create release and upload VSIX
          env:
            GH_TOKEN: ${{ github.token }}
            TAG: ${{ github.ref_name }}
          shell: bash
          run: |
            shopt -s nullglob
            files=(dist/*.vsix)
            if (( ${#files[@]} == 0 )); then
              echo "::error::No VSIX packages found"
              exit 1
            fi

            releases=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[].tag_name')

            if ! grep -Fxq -- "$TAG" <<< "$releases"; then
              gh release create "$TAG" \
                --verify-tag \
                --title "$TAG" \
                --generate-notes
            fi

            gh release upload "$TAG" "${files[@]}" --clobber
