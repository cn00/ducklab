name: Publish-VSCode

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - ducklab-vscode/v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: ./vs-extension
        run: |
          chmod +x package.sh
          npm i -g pnpm
          pnpm install
          pnpm run build
          pnpm run package
      - name: Upload VSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ducklab-vsix
          path: vs-extension/dist/*.vsix
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: ./vs-extension
        run: |
          npm i -g pnpm
          pnpm install
      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          name: ducklab-vsix
          path: vs-extension/dist
      - name: Publish to VS Code Marketplace
        working-directory: ./vs-extension
        env:
          VSCE_PAT: ${{ secrets.VSCODE_MARKETPLACE_PAT }}
        run: pnpm run publish
